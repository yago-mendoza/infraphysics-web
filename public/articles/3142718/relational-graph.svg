<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Relational graph of the two-tank system</title><desc id="desc">Reconstruction of the original TikZ graph, with variables as circles, elementary relations as labels and sensor branches in pale red.</desc>
  <rect width="1200" height="760" fill="#fff"/><style>.e{stroke:#222;stroke-width:1.7;fill:none}.se{stroke:#c77;stroke-width:1.7;fill:none}.v{fill:#fff;stroke:#222;stroke-width:1.7}.sv{fill:#fff;stroke:#c77;stroke-width:1.7}.t{font:italic 18px Georgia,serif;fill:#111}.st{font:italic 18px Georgia,serif;fill:#b55}.m{font:17px Georgia,serif;fill:#111}.sm{font:17px Georgia,serif;fill:#b55}.cap{font:20px Georgia,serif;fill:#111}.note{font:14px Georgia,serif;fill:#555}</style>
  <text class="cap" x="600" y="35" text-anchor="middle">System relational graph</text><text class="note" x="600" y="58" text-anchor="middle">Black: physical system. Pale red: sensors and measured variables.</text>
  <g>
    <path class="e" d="M175 130H265M315 130H410M450 160V225M450 275V340M480 365H575M625 365H720M750 335V260M750 210V145M780 120H875M925 120H1020M750 395V470M750 520V590M780 615H875M925 615H1020M750 650V705M625 395V470M600 520V590M570 615H475M425 615H330M300 585V520M300 470V395M270 365H175M125 365H80"/>
    <path class="e" d="M450 365H600M600 365V470M600 365V590M750 365H600M900 120V240M900 290V585M900 615H750M450 365V240M450 190V130"/>
    <path class="se" d="M125 130H80M55 155V220M55 270V335M1020 120H1070M1095 145V210M1095 260V335M1020 615H1070M1095 590V520M1095 470V400M300 705V735M600 705V735M900 705V735"/>
    <g class="v"><circle cx="450" cy="130" r="30"/><circle cx="450" cy="365" r="30"/><circle cx="600" cy="365" r="30"/><circle cx="750" cy="120" r="30"/><circle cx="750" cy="365" r="30"/><circle cx="750" cy="615" r="30"/><circle cx="600" cy="615" r="30"/><circle cx="300" cy="365" r="30"/><circle cx="300" cy="615" r="30"/><circle cx="900" cy="120" r="30"/><circle cx="900" cy="615" r="30"/></g>
    <g class="sv"><circle cx="55" cy="365" r="27"/><circle cx="55" cy="130" r="27"/><circle cx="1095" cy="120" r="27"/><circle cx="1095" cy="365" r="27"/><circle cx="1095" cy="615" r="27"/><circle cx="300" cy="735" r="22"/><circle cx="600" cy="735" r="22"/><circle cx="900" cy="735" r="22"/></g>
    <g class="t" text-anchor="middle" dominant-baseline="middle"><text x="450" y="130">Uₚ</text><text x="450" y="365">h₁</text><text x="600" y="365">V₁</text><text x="750" y="120">Qₚ</text><text x="750" y="365">Q₁₂</text><text x="750" y="615">h₂</text><text x="600" y="615">U_b</text><text x="300" y="365">my₁</text><text x="300" y="615">my₂</text><text x="900" y="120">mQₚ</text><text x="900" y="615">Qₒ</text></g>
    <g class="st" text-anchor="middle" dominant-baseline="middle"><text x="55" y="365">my₁</text><text x="55" y="130">mUₚ</text><text x="1095" y="120">mQₚ</text><text x="1095" y="365">mU_b</text><text x="1095" y="615">my₂</text><text x="300" y="735">my₂</text><text x="600" y="735">mU_b</text><text x="900" y="735">Uₒ</text></g>
    <g class="m" text-anchor="middle"><text x="290" y="136">M₁₂</text><text x="450" y="255">M₈</text><text x="600" y="350">M₂</text><text x="750" y="245">M₁</text><text x="900" y="275">M₁₁</text><text x="600" y="500">M₆</text><text x="750" y="500">M₃</text><text x="900" y="510">M₇</text><text x="450" y="620">M₁₀</text><text x="300" y="500">M₉</text></g>
    <g class="sm" text-anchor="middle"><text x="55" y="250">M₁₂</text><text x="1095" y="250">M₁₁</text><text x="1095" y="500">M₁₃</text></g>
  </g>
</svg>
