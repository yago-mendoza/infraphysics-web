<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 330" role="img" aria-labelledby="title desc">
  <title id="title">Fault detection and isolation architecture</title><desc id="desc">Reconstruction of the original TikZ block diagram from plant measurements through analytical redundancy relations, threshold tests and signature matching.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#222"/></marker></defs>
  <rect width="1250" height="330" fill="#fff"/><style>.b{fill:#fff;stroke:#222;stroke-width:1.8}.l{stroke:#222;stroke-width:1.8;fill:none;marker-end:url(#a)}.t{font:18px Georgia,serif;fill:#111}.s{font:italic 15px Georgia,serif;fill:#333}.cap{font:20px Georgia,serif;fill:#111}</style>
  <text class="cap" x="625" y="35" text-anchor="middle">Fault detection and isolation architecture</text>
  <g transform="translate(35 95)"><rect class="b" width="190" height="90" rx="5"/><text class="t" x="95" y="38" text-anchor="middle">Two-tank process</text><text class="s" x="95" y="64" text-anchor="middle">Simulink</text></g>
  <g transform="translate(315 95)"><rect class="b" width="205" height="90" rx="5"/><text class="t" x="102" y="38" text-anchor="middle">Residual generation</text><text class="s" x="102" y="64" text-anchor="middle">ARR₁ … ARR₄</text></g>
  <g transform="translate(610 95)"><rect class="b" width="190" height="90" rx="5"/><text class="t" x="95" y="38" text-anchor="middle">Threshold test</text><text class="s" x="95" y="64" text-anchor="middle">|rᵢ| ≷ τᵢ</text></g>
  <g transform="translate(890 95)"><rect class="b" width="180" height="90" rx="5"/><text class="t" x="90" y="38" text-anchor="middle">Signature</text><text class="t" x="90" y="64" text-anchor="middle">matching</text></g>
  <text class="t" x="1165" y="127" text-anchor="middle">Fault</text><text class="t" x="1165" y="153" text-anchor="middle">indicator</text>
  <path class="l" d="M225 140H305M520 140H600M800 140H880M1070 140H1120"/>
  <text class="s" x="265" y="123" text-anchor="middle">myᵢ, mQₚ, mUₚ/b</text><text class="s" x="560" y="123" text-anchor="middle">rᵢ</text><text class="s" x="840" y="123" text-anchor="middle">φᵢ∈{0,1}</text>
  <text class="s" x="625" y="245" text-anchor="middle">The detector does not infer a label directly from raw data. It first asks whether each physical constraint still closes.</text>
</svg>
